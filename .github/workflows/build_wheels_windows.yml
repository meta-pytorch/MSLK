name: Build MSLK Windows Wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
    tags:
      # Release candidate tag look like: v1.11.0-rc1
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+
  schedule:
    - cron: 30 12 * * *
  workflow_dispatch:
    inputs:
      publish:
        description: Upload wheels from the selected branch to the nightly index
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  source-commit:
    if: ${{ github.repository_owner == 'meta-pytorch' }}
    runs-on: ubuntu-latest
    steps:
    - name: Record source commit
      env:
        PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      run: |
        {
          echo "### Source commit"
          echo "[\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
          echo "ref \`${GITHUB_REF_NAME}\`, event \`${GITHUB_EVENT_NAME}\`, publish \`${PUBLISH}\`"
        } >> "${GITHUB_STEP_SUMMARY}"

  generate-matrix:
    if: ${{ github.repository_owner == 'meta-pytorch' }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: windows
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      with-cuda: enable
      with-rocm: disable
      with-cpu: disable

  filter-matrix:
    if: ${{ github.repository_owner == 'meta-pytorch' }}
    needs: generate-matrix
    runs-on: linux.24_04.4x
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
    - uses: actions/setup-python@v4
    - name: Checkout MSLK repository
      uses: actions/checkout@v4
      with:
        repository: meta-pytorch/MSLK
        ref: ${{ github.sha }}
    - name: Filter Generated Built Matrix
      id: filter
      env:
        MAT: ${{ needs.generate-matrix.outputs.matrix }}
      # Nova Coordinate Filters:
      # cuda/12.6: No longer supported in MSLK
      run: |
        set -ex
        pwd
        ls
        MATRIX_BLOB="$( python .github/scripts/filter_nova_matrix.py --filter 'desired_cuda:cu126' )"
        echo "${MATRIX_BLOB}"
        echo "matrix=${MATRIX_BLOB}" >> "${GITHUB_OUTPUT}"

  build:
    if: ${{ github.repository_owner == 'meta-pytorch' }}
    needs: filter-matrix
    name: meta-pytorch/MSLK
    uses: pytorch/test-infra/.github/workflows/build_wheels_windows.yml@main
    with:
      repository: meta-pytorch/MSLK
      ref: ${{ github.sha }}
      pre-script: .github/scripts/nova_prescript_windows.bash
      post-script: ""
      smoke-test-script: ""
      env-script: .github/scripts/nova_dir_windows.bat
      package-name: mslk
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      trigger-event: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && 'schedule' || github.event_name }}
      submodules: ""
      # Python-only builds are fast; no C++ compilation needed
      timeout: 60
